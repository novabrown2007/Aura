name: BuildTest

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install requirements
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\windows\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\android\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\web\requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build Windows source package
        id: source_windows
        continue-on-error: true
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\windows\build.py

      - name: Build Android source package
        id: source_android
        continue-on-error: true
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\android\build.py

      - name: Build Web source package
        id: source_web
        continue-on-error: true
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\web\build.py

      - name: Build Windows interface executable
        id: exe_windows
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location build\interfaces\windows
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_windows run_aura_windows.py
          Pop-Location

      - name: Build Android interface executable
        id: exe_android
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location build\interfaces\android
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_android run_aura_android.py
          Pop-Location

      - name: Build Web interface executable
        id: exe_web
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Push-Location build\interfaces\web
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_web run_aura_web.py
          Pop-Location

      - name: Test Windows interface
        id: test_windows
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_windows_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\windows.txt
          $output
          exit $exitCode

      - name: Test Android interface
        id: test_android
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_android_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\android.txt
          $output
          exit $exitCode

      - name: Test Web interface
        id: test_web
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_web_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\web.txt
          $output
          exit $exitCode

      - name: Run full test suite
        id: test_full
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe run_tests.py --suite all 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\full-suite.txt
          $output
          exit $exitCode

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-interface-builds
          path: |
            build/interfaces/aura_windows.zip
            build/interfaces/aura_android.zip
            build/interfaces/aura_web.zip
            build/interfaces/windows/dist/aura_windows.exe
            build/interfaces/android/dist/aura_android.exe
            build/interfaces/web/dist/aura_web.exe
            build/reports/tests/*.txt
          if-no-files-found: warn

      - name: Send Discord push log
        if: always() && github.event_name == 'push'
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSH_AUTHOR: ${{ github.event.pusher.name }}
          PUSH_COMMITS_JSON: ${{ toJson(github.event.commits) }}
          SOURCE_WINDOWS_STATUS: ${{ steps.source_windows.outcome }}
          SOURCE_ANDROID_STATUS: ${{ steps.source_android.outcome }}
          SOURCE_WEB_STATUS: ${{ steps.source_web.outcome }}
          EXE_WINDOWS_STATUS: ${{ steps.exe_windows.outcome }}
          EXE_ANDROID_STATUS: ${{ steps.exe_android.outcome }}
          EXE_WEB_STATUS: ${{ steps.exe_web.outcome }}
          TEST_WINDOWS_STATUS: ${{ steps.test_windows.outcome }}
          TEST_ANDROID_STATUS: ${{ steps.test_android.outcome }}
          TEST_WEB_STATUS: ${{ steps.test_web.outcome }}
          TEST_FULL_STATUS: ${{ steps.test_full.outcome }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Host "DISCORD_WEBHOOK_URL secret is not configured; skipping Discord push log."
            exit 0
          }

          $commits = $env:PUSH_COMMITS_JSON | ConvertFrom-Json
          $commitLines = @()
          foreach ($commit in $commits) {
            $shortSha = $commit.id.Substring(0, 7)
            $message = ($commit.message -split "`n")[0]
            $commitLines += "- ``$shortSha`` $message"
          }
          if ($commitLines.Count -eq 0) {
            $commitLines = @("- No commit payload was provided.")
          }
          $commitText = ($commitLines -join "`n")
          if ($commitText.Length -gt 1000) {
            $commitText = $commitText.Substring(0, 997) + "..."
          }

          $testStatus = @(
            "Windows interface: $env:TEST_WINDOWS_STATUS",
            "Android interface: $env:TEST_ANDROID_STATUS",
            "Web interface: $env:TEST_WEB_STATUS",
            "Full suite: $env:TEST_FULL_STATUS"
          ) -join "`n"

          $statuses = @(
            $env:SOURCE_WINDOWS_STATUS,
            $env:SOURCE_ANDROID_STATUS,
            $env:SOURCE_WEB_STATUS,
            $env:EXE_WINDOWS_STATUS,
            $env:EXE_ANDROID_STATUS,
            $env:EXE_WEB_STATUS,
            $env:TEST_WINDOWS_STATUS,
            $env:TEST_ANDROID_STATUS,
            $env:TEST_WEB_STATUS,
            $env:TEST_FULL_STATUS
          )
          $overallStatus = if ($statuses -contains "failure" -or $statuses -contains "cancelled") { "failure" } else { "success" }

          $executablePaths = @(
            "build/interfaces/windows/dist/aura_windows.exe",
            "build/interfaces/android/dist/aura_android.exe",
            "build/interfaces/web/dist/aura_web.exe"
          )
          $missingExecutables = $executablePaths | Where-Object { -not (Test-Path $_) }
          if ($missingExecutables.Count -gt 0) {
            Write-Warning "Some executables are missing and will not be attached: $($missingExecutables -join ', ')"
          }

          $payload = @{
            content = $env:REPOSITORY_NAME
            embeds = @(
              @{
                title = "Push"
                color = if ($overallStatus -eq "success") { 5763719 } else { 15548997 }
                fields = @(
                  @{
                    name = "Branch"
                    value = $env:PUSH_BRANCH
                    inline = $true
                  },
                  @{
                    name = "Author"
                    value = $env:PUSH_AUTHOR
                    inline = $true
                  },
                  @{
                    name = "Commits"
                    value = $commitText
                    inline = $false
                  }
                )
              },
              @{
                color = if ($overallStatus -eq "success") { 5763719 } else { 15548997 }
                fields = @(
                  @{
                    name = "Tests"
                    value = $testStatus
                    inline = $false
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress

          Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType "application/json" -Body $payload

          $filePayload = @{
            content = "Executables"
          } | ConvertTo-Json -Depth 4 -Compress
          $fileForm = @{
            payload_json = $filePayload
          }
          $fileIndex = 0
          foreach ($path in $executablePaths) {
            if (Test-Path $path) {
              $fileForm["files[$fileIndex]"] = Get-Item $path
              $fileIndex += 1
            }
          }

          if ($fileIndex -gt 0) {
            Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -Form $fileForm
          } else {
            Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType "application/json" -Body (@{ content = "Executables were not produced." } | ConvertTo-Json -Compress)
          }

      - name: Fail workflow on build or test failure
        if: always()
        shell: pwsh
        env:
          SOURCE_WINDOWS_STATUS: ${{ steps.source_windows.outcome }}
          SOURCE_ANDROID_STATUS: ${{ steps.source_android.outcome }}
          SOURCE_WEB_STATUS: ${{ steps.source_web.outcome }}
          EXE_WINDOWS_STATUS: ${{ steps.exe_windows.outcome }}
          EXE_ANDROID_STATUS: ${{ steps.exe_android.outcome }}
          EXE_WEB_STATUS: ${{ steps.exe_web.outcome }}
          TEST_WINDOWS_STATUS: ${{ steps.test_windows.outcome }}
          TEST_ANDROID_STATUS: ${{ steps.test_android.outcome }}
          TEST_WEB_STATUS: ${{ steps.test_web.outcome }}
          TEST_FULL_STATUS: ${{ steps.test_full.outcome }}
        run: |
          $failed = @(
            "Windows source package: $env:SOURCE_WINDOWS_STATUS",
            "Android source package: $env:SOURCE_ANDROID_STATUS",
            "Web source package: $env:SOURCE_WEB_STATUS",
            "Windows executable: $env:EXE_WINDOWS_STATUS",
            "Android executable: $env:EXE_ANDROID_STATUS",
            "Web executable: $env:EXE_WEB_STATUS",
            "Windows interface tests: $env:TEST_WINDOWS_STATUS",
            "Android interface tests: $env:TEST_ANDROID_STATUS",
            "Web interface tests: $env:TEST_WEB_STATUS",
            "Full test suite: $env:TEST_FULL_STATUS"
          ) | Where-Object { $_ -notmatch ": success$" }

          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error $_ }
            exit 1
          }
