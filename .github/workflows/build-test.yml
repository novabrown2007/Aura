name: BuildTest

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  source_packages:
    name: Build Source Packages
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install requirements
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\windows\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\android\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\web\requirements.txt

      - name: Build Windows source package
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\windows\build.py

      - name: Build Android source package
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\android\build.py

      - name: Build Web source package
        shell: pwsh
        run: .\.venv\Scripts\python.exe interface\web\build.py

      - name: Upload source packages
        uses: actions/upload-artifact@v4
        with:
          name: aura-source-packages
          path: build/interfaces/**
          if-no-files-found: error

  executables:
    name: Build Executables
    runs-on: windows-latest
    needs: source_packages

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download source packages
        uses: actions/download-artifact@v4
        with:
          name: aura-source-packages
          path: build/interfaces

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install executable build requirements
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r build\interfaces\windows\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r build\interfaces\android\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r build\interfaces\web\requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build Windows executable
        shell: pwsh
        run: |
          Push-Location build\interfaces\windows
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_windows run_aura_windows.py
          Pop-Location

      - name: Build Android executable
        shell: pwsh
        run: |
          Push-Location build\interfaces\android
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_android run_aura_android.py
          Pop-Location

      - name: Build Web executable
        shell: pwsh
        run: |
          Push-Location build\interfaces\web
          ..\..\..\.venv\Scripts\python.exe -m PyInstaller --onefile --name aura_web run_aura_web.py
          Pop-Location

      - name: Stage executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\executables | Out-Null
          Copy-Item build\interfaces\windows\dist\aura_windows.exe build\executables\aura_windows.exe
          Copy-Item build\interfaces\android\dist\aura_android.exe build\executables\aura_android.exe
          Copy-Item build\interfaces\web\dist\aura_web.exe build\executables\aura_web.exe

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: aura-executables
          path: build/executables/*.exe
          if-no-files-found: error

  tests:
    name: Run Tests
    runs-on: windows-latest
    needs: executables
    outputs:
      windows: ${{ steps.test_windows.outcome }}
      android: ${{ steps.test_android.outcome }}
      web: ${{ steps.test_web.outcome }}
      full: ${{ steps.test_full.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtual environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip

      - name: Install requirements
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\windows\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\android\requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r interface\web\requirements.txt

      - name: Test Windows interface
        id: test_windows
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_windows_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\windows.txt
          $output
          exit $exitCode

      - name: Test Android interface
        id: test_android
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_android_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\android.txt
          $output
          exit $exitCode

      - name: Test Web interface
        id: test_web
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe -m unittest tests.interfaceTests.test_web_interface -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\web.txt
          $output
          exit $exitCode

      - name: Run full test suite
        id: test_full
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\reports\tests | Out-Null
          $output = & .\.venv\Scripts\python.exe run_tests.py --suite all 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content build\reports\tests\full-suite.txt
          $output
          exit $exitCode

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-test-logs
          path: build/reports/tests/*.txt
          if-no-files-found: warn

      - name: Fail on test failure
        if: always()
        shell: pwsh
        env:
          TEST_WINDOWS_STATUS: ${{ steps.test_windows.outcome }}
          TEST_ANDROID_STATUS: ${{ steps.test_android.outcome }}
          TEST_WEB_STATUS: ${{ steps.test_web.outcome }}
          TEST_FULL_STATUS: ${{ steps.test_full.outcome }}
        run: |
          $failed = @(
            "Windows interface tests: $env:TEST_WINDOWS_STATUS",
            "Android interface tests: $env:TEST_ANDROID_STATUS",
            "Web interface tests: $env:TEST_WEB_STATUS",
            "Full test suite: $env:TEST_FULL_STATUS"
          ) | Where-Object { $_ -notmatch ": success$" }

          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error $_ }
            exit 1
          }

  discord_log:
    name: Log To Discord
    runs-on: windows-latest
    if: always() && github.event_name == 'push'
    needs:
      - source_packages
      - executables
      - tests

    steps:
      - name: Download executables
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: aura-executables
          path: build/executables

      - name: Send Discord push log
        shell: pwsh
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSH_AUTHOR: ${{ github.event.pusher.name }}
          PUSH_COMMITS_JSON: ${{ toJson(github.event.commits) }}
          SOURCE_JOB_STATUS: ${{ needs.source_packages.result }}
          EXE_JOB_STATUS: ${{ needs.executables.result }}
          TEST_JOB_STATUS: ${{ needs.tests.result }}
          TEST_WINDOWS_STATUS: ${{ needs.tests.outputs.windows }}
          TEST_ANDROID_STATUS: ${{ needs.tests.outputs.android }}
          TEST_WEB_STATUS: ${{ needs.tests.outputs.web }}
          TEST_FULL_STATUS: ${{ needs.tests.outputs.full }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISCORD_WEBHOOK_URL)) {
            Write-Host "DISCORD_WEBHOOK_URL secret is not configured; skipping Discord push log."
            exit 0
          }

          $commits = $env:PUSH_COMMITS_JSON | ConvertFrom-Json
          $commitLines = @()
          foreach ($commit in $commits) {
            $shortSha = $commit.id.Substring(0, 7)
            $message = ($commit.message -split "`n")[0]
            $commitLines += "- ``$shortSha`` $message"
          }
          if ($commitLines.Count -eq 0) {
            $commitLines = @("- No commit payload was provided.")
          }
          $commitText = ($commitLines -join "`n")
          if ($commitText.Length -gt 1000) {
            $commitText = $commitText.Substring(0, 997) + "..."
          }

          function Format-Status($value) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return "skipped"
            }
            return $value
          }

          $testStatus = @(
            "Windows interface: $(Format-Status $env:TEST_WINDOWS_STATUS)",
            "Android interface: $(Format-Status $env:TEST_ANDROID_STATUS)",
            "Web interface: $(Format-Status $env:TEST_WEB_STATUS)",
            "Full suite: $(Format-Status $env:TEST_FULL_STATUS)"
          ) -join "`n"

          $overallStatus = if (
            $env:SOURCE_JOB_STATUS -eq "success" -and
            $env:EXE_JOB_STATUS -eq "success" -and
            $env:TEST_JOB_STATUS -eq "success"
          ) { "success" } else { "failure" }

          $payload = @{
            content = $env:REPOSITORY_NAME
            embeds = @(
              @{
                title = "Push"
                color = if ($overallStatus -eq "success") { 5763719 } else { 15548997 }
                fields = @(
                  @{
                    name = "Branch"
                    value = $env:PUSH_BRANCH
                    inline = $true
                  },
                  @{
                    name = "Author"
                    value = $env:PUSH_AUTHOR
                    inline = $true
                  },
                  @{
                    name = "Commits"
                    value = $commitText
                    inline = $false
                  }
                )
              },
              @{
                color = if ($overallStatus -eq "success") { 5763719 } else { 15548997 }
                fields = @(
                  @{
                    name = "Tests"
                    value = $testStatus
                    inline = $false
                  }
                )
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress

          Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType "application/json" -Body $payload

          $executablePaths = @(
            "build/executables/aura_windows.exe",
            "build/executables/aura_android.exe",
            "build/executables/aura_web.exe"
          )
          $filePayload = @{
            content = "Executables"
          } | ConvertTo-Json -Depth 4 -Compress
          $fileForm = @{
            payload_json = $filePayload
          }
          $fileIndex = 0
          foreach ($path in $executablePaths) {
            if (Test-Path $path) {
              $fileForm["files[$fileIndex]"] = Get-Item $path
              $fileIndex += 1
            }
          }

          if ($fileIndex -gt 0) {
            Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -Form $fileForm
          } else {
            Invoke-RestMethod -Method Post -Uri $env:DISCORD_WEBHOOK_URL -ContentType "application/json" -Body (@{ content = "Executables were not produced." } | ConvertTo-Json -Compress)
          }
