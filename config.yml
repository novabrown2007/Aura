llm:
  # gemini | ollama
  activeProvider: gemini
  # gemini | ollama | none
  fallbackProvider: none
  retryCount: 2
  timeout: 30

  ollama:
    model: llama3.2:1b
    endpoint: CHANGE_ME

  gemini:
    model: gemini-2.5-flash
    api_secret: CHANGE_ME

  history:
    enabled: true
    limit: 25
    persistAcrossRestarts: false

  memory:
    enabled: true
    frequency: 20
    semantic:
      enabled: true
      limit: 5
      provider: local

  logging:
    enabled: true
    path: logs/llm

  intent:
    confidenceThreshold: 0.75
    contextWindow: 6

database:
  host: localhost
  port: 3306
  name: aura
  user: CHANGE_ME
  password: CHANGE_ME

threading:
  max_threads: 10

voice:
  enabled: false
  model: small.en
  device: cpu
  computeType: int8
  sampleRate: 16000
  voiceEnabled: true
  voiceModelPath: en_US-lessac-medium
  voiceOutputDirectory: temp/voice
  voicePlaybackEnabled: true
  voiceSampleRate: 22050
  pushToTalkEnabled: false
  pushToTalkHotkey: enter
  pushToTalkAutoSpeak: true
  pushToTalkTempAudioDirectory: temp/push_to_talk
  wakeWord:
    wakeWordEnabled: true
    wakeWordPhrase: Hey Aura
    wakeWordPhrases: ["Aura", "Hey Aura", "Aura Wake"]
    wakeWordSensitivity: 0.5
    wakeWordCooldownSeconds: 5
    wakeWordMicrophoneDevice:
    wakeWordModelPath: ''
    wakeWordInferenceFramework: onnx
    wakeWordAutoStart: true
    wakeWordDebugLogging: false

memory:
  enabled: true
  databasePath: aura_memory.sqlite3
  maxResults: 8
  summaryLength: 280
  importanceThreshold: 0.35
  autoSummarization: true
  injectionEnabled: true
  maxInjectionCount: 5
  maxInjectionCharacters: 900
  recencyWeight: 0.18
  importanceWeight: 0.24
  duplicateFiltering: true
  compressionEnabled: true
  minRelevance: 0.18
  retrievalCandidateLimit: 24
  retrievalDebug: true

developerUI:
  enabled: true
  refreshRate: 750
  maxEvents: 500
  verboseLogging: false
  traceEvents: true

homeAutomationBridge:
  host: 127.0.0.1
  port: 8080
  ssl: false
  timeout: 5
  refreshSeconds: 5
  protocolPath: /protocol/aura
  inboxPath: /protocol/inbox
  subscriptionsPath: /protocol/subscriptions
  heartbeatPath: /protocol/heartbeat
  sessionId: auto
  interface: desktop
  heartbeatSeconds: 30
