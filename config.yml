llm:
  activeProvider: gemini
  fallbackProvider: ollama
  offlineMode: false
  retryCount: 2
  timeout: 30

  ollama:
    model: llama3.1:8b
    endpoint: CHANGE_ME

  gemini:
    model: gemini-2.5-flash
    api_secret: CHANGE_ME

  history:
    enabled: true
    limit: 25

  memory:
    enabled: true
    frequency: 20
    semantic:
      enabled: true
      limit: 5
      provider: local

  logging:
    enabled: true
    path: logs/llm

  intent:
    confidenceThreshold: 0.75
    contextWindow: 6

database:
  host: localhost
  port: 3306
  name: aura
  user: CHANGE_ME
  password: CHANGE_ME

threading:
  max_threads: 10
