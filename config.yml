llm:
  activeProvider: gemini
  fallbackProvider: ollama
  retryCount: 2
  timeout: 30

  ollama:
    model: deepseek-r1:8b
    endpoint: CHANGE_ME

  gemini:
    model: gemini-2.5-flash
    api_secret: CHANGE_ME

  history:
    enabled: true
    limit: 25

  memory:
    enabled: true
    frequency: 20
    semantic:
      enabled: true
      limit: 5
      provider: local

  logging:
    enabled: true
    path: logs/llm

  intent:
    confidenceThreshold: 0.75
    contextWindow: 6

database:
  host: localhost
  port: 3306
  name: aura
  user: CHANGE_ME
  password: CHANGE_ME

threading:
  max_threads: 10

homeAutomationBridge:
  host: 127.0.0.1
  port: 8080
  ssl: false
  timeout: 5
  refreshSeconds: 5
  protocolPath: /protocol/aura
  inboxPath: /protocol/inbox
  subscriptionsPath: /protocol/subscriptions
  heartbeatPath: /protocol/heartbeat
  sessionId: auto
  interface: desktop
  heartbeatSeconds: 30
