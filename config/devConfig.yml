# Aura backend/developer configuration.
#
# This file is for operational tuning, runtime defaults, polling rates,
# local model choices, and developer UI behavior. User-facing secrets and
# credentials belong in config/config.yml.

logging:
  logPath: ./logs/
  llmLogPath: ./logs/llm/
  loggingEnabled: true
  consoleLoggingEnabled: true
  fileLoggingEnabled: true
  debugLoggingEnabled: true

interruptions:
  interruptionsEnabled: true
  interruptionVoiceCommandsEnabled: true
  interruptionClearConversationState: true
  interruptionDebugLogging: true

llm:
  # Primary LLM provider Aura should use.
  activeProvider: ollama
  # Provider to try if the active provider fails.
  fallbackProvider: gemini
  # Number of model request retries before surfacing a failure.
  retryCount: 2
  # Model request timeout in seconds.
  timeout: 30

  ollama:
    # Ollama model name to request from the local Ollama server.
    model: gemma4:e4b
  gemini:
    # Gemini model name.
    model: gemini-2.5-flash

  history:
    # Whether Aura keeps short-term conversation history.
    enabled: true
    # Maximum conversation turns retained in short-term history.
    limit: 25
    # Whether short-term history should survive process restarts.
    persistAcrossRestarts: true

  memory:
    # Whether LLM memory integration is enabled.
    enabled: true
    # Frequency, in turns, for memory-related maintenance.
    frequency: 5
    semantic:
      # Whether semantic memory retrieval is enabled.
      enabled: true
      # Maximum semantic memories to include per retrieval.
      limit: 6
      # Embedding/retrieval provider.
      provider: local

responses:
  # Whether Aura emits structured multimodal assistant responses.
  structuredResponsesEnabled: true
  # Whether spoken text delivery is enabled.
  spokenResponseEnabled: true
  # Whether UI text delivery is enabled.
  uiResponseEnabled: true
  # Whether response metadata is generated.
  responseMetadataEnabled: true
  # Whether follow-up prompts are generated.
  responseFollowupsEnabled: true
  # Whether response validation is enforced.
  responseValidationEnabled: true

interface:
  desktop:
    windows:
      # Whether the Windows overlay presence layer is enabled.
      desktopOverlayEnabled: true
      # Whether the floating assistant bubble is enabled.
      assistantBubbleEnabled: true
      # Whether Aura should create a Windows system tray icon.
      systemTrayEnabled: true
      # Whether the main window minimizes to tray when closed with X.
      minimizeToTrayOnClose: true
      # Keep the overlay above other windows.
      overlayAlwaysOnTop: true
      # Overlay transparency for the main shell and bubble.
      overlayOpacity: 0.92
      # Whether subtle overlay animations are enabled.
      overlayAnimationsEnabled: true
      # Whether desktop notification popups are enabled.
      overlayNotificationsEnabled: true
      # Whether the overlay starts in compact mode.
      overlayCompactMode: true
      # Whether Aura starts hidden to tray.
      overlayStartMinimized: false

  logging:
    # Whether LLM request/response logging is enabled.
    enabled: true
    # Directory for LLM logs.
    path: ./logs/llm/

  intent:
    # Minimum confidence required before an interpreted intent is trusted.
    confidenceThreshold: 0.75
    # Number of recent context turns considered by the intent pipeline.
    contextWindow: 6

threading:
  # Maximum worker threads Aura may use for background tasks.
  max_threads: 10

voice:
  STT:
    # Whether microphone STT capture is enabled.
    enabled: true
    # Faster-Whisper model name for speech-to-text.
    model: small.en
    # Device used for Faster-Whisper inference.
    device: cpu
    # Faster-Whisper compute type.
    computeType: int8
    # Microphone input sample rate for STT capture.
    # Valid value: integer Hz. Aura expects 16000 for local voice input.
    sampleRate: 16000
  TTS:
    # Whether Piper text-to-speech output is enabled.
    voiceEnabled: true
    # Piper voice model path or model basename.
    voiceModelPath: en_US-lessac-medium
    # Directory used for temporary/generated TTS audio.
    voiceOutputDirectory: temp/voice
    # Whether generated speech should play back through the local audio device.
    voicePlaybackEnabled: true
    # Piper output sample rate.
    # Valid value: integer Hz. The default Piper voice uses 22050.
    voiceSampleRate: 22050
    # Download the configured Piper voice model automatically when missing.
    voiceAutoDownloadModel: true
  PTT:
    # Push-to-talk hotkey label for developer/manual flows.
    # Valid value: key name string. The current dev console uses enter.
    pushToTalkHotkey: enter
    # Whether push-to-talk responses should be spoken automatically.
    pushToTalkAutoSpeak: true
    # Directory used for temporary push-to-talk recordings.
    pushToTalkTempAudioDirectory: temp/push_to_talk
  vad:
    # Whether automatic speech endpoint detection is enabled.
    vadEnabled: true
    # Required trailing silence before Aura finalizes a voice turn.
    vadSilenceThresholdSeconds: 1.2
    # Silero speech probability threshold. Higher is stricter.
    vadSpeechThreshold: 0.5
    # Ignore speech bursts shorter than this duration.
    vadMinSpeechDuration: 0.3
    # Hard recording limit to prevent stuck microphone sessions.
    vadMaxRecordingDuration: 30
    # Whether VAD state transitions emit debug log details.
    vadDebugLogging: true
  wakeWord:
    # Detection threshold for accepting a wake word prediction.
    # Valid value: float from 0.0 to 1.0. Higher is stricter.
    wakeWordSensitivity: 0.5
    # Cooldown after an accepted wake word before listening resumes.
    wakeWordCooldownSeconds: 5
    # Optional microphone device selector for sounddevice.
    # Valid values: blank/null for default device, integer device index, or device name string.
    wakeWordMicrophoneDevice:
    # Optional explicit OpenWakeWord model path.
    # Valid value: blank for phrase-based lookup, or path to a .onnx/.tflite wake word model.
    wakeWordModelPath: ''
    # OpenWakeWord inference backend.
    # Valid values: onnx, tflite.
    wakeWordInferenceFramework: onnx
    # Whether wake word listening starts automatically during Aura startup.
    wakeWordAutoStart: true
    # Whether to log per-frame wake word prediction details.
    wakeWordDebugLogging: false
    wakeWordDebugLoggingLocation: logs/wake_word
    # Delay before resuming wake listening after a completed voice turn.
    wakeWordResumeDelaySeconds: 1.5
    # If configured Aura-specific phrases do not have local models yet, fall
    # back to a built-in OpenWakeWord model so always-active listening starts.
    wakeWordAllowPretrainedFallback: true
    wakeWordFallbackModel: hey_jarvis
    wakeWordAutoDownloadModels: true

memory:
  # Whether Aura's long-term memory system is enabled.
  enabled: true
  # SQLite database path for persisted memories.
  databasePath: aura_memory.sqlite3
  # Maximum memory results returned by default.
  maxResults: 10
  # Target character length for generated memory summaries.
  summaryLength: 280
  # Minimum importance score for memory retention/selection.
  # Valid value: float from 0.0 to 1.0.
  importanceThreshold: 0.35
  # Whether Aura should automatically summarize memory content.
  autoSummarization: true
  # Whether retrieved memory should be injected into prompts.
  injectionEnabled: true
  # Maximum number of memory items injected into a prompt.
  maxInjectionCount: 10
  # Maximum total injected memory characters.
  maxInjectionCharacters: 1024
  # Weight assigned to recency during retrieval scoring.
  recencyWeight: 0.18
  # Weight assigned to importance during retrieval scoring.
  importanceWeight: 0.24
  # Whether duplicate memories should be filtered from retrieval results.
  duplicateFiltering: true
  # Whether prompt memory context can be compressed.
  compressionEnabled: true
  # Minimum retrieval relevance score.
  # Valid value: float from 0.0 to 1.0.
  minRelevance: 0.2
  # Number of candidate memories considered before final ranking.
  retrievalCandidateLimit: 24
  # Whether retrieval debug details are retained for developer UI visibility.
  retrievalDebug: true
  semantic:
    # Whether semantic retrieval is enabled.
    enabled: true
    # Preferred embedding provider. Valid values: gemini or local.
    provider: gemini
    # Embedding model name to request when the provider supports it.
    model: text-embedding-004
    # Maximum semantic retrieval results.
    maxResults: 5
    # Minimum similarity score required for semantic matches.
    minimumSimilarity: 0.65
    # Weight assigned to recency during semantic ranking.
    recencyWeight: 0.2
    # Weight assigned to importance during semantic ranking.
    importanceWeight: 0.2
    # Weight assigned to semantic similarity during semantic ranking.
    similarityWeight: 0.6
    # Whether new/updated memories are automatically indexed.
    autoIndex: true

developerUI:
  # Whether the developer UI is enabled.
  enabled: true
  # Developer UI refresh interval in milliseconds.
  refreshRate: 1000
  # Maximum event rows retained in the developer UI event log.
  maxEvents: 500
  # Whether the developer UI should emit verbose logging.
  verboseLogging: false
  # Whether event bus emissions should be traced into developer UI state.
  traceEvents: true

conversation:
  # Seconds of inactivity before short-term conversational context resets.
  conversationTimeoutSeconds: 300

personality:
  # Controlled conversational style layer. This never overrides valid commands.
  personalityEnabled: true
  # Allow occasional subtle humor in non-command conversations.
  humorEnabled: true
  # Allow lightweight contextual suggestions.
  suggestionsEnabled: true
  # How proactive Aura may be. Valid value: 0.0 to 1.0.
  initiativeLevel: 0.35
  # Default tone mode: casual, professional, concise, developer, or voice.
  toneMode: casual
  # Maximum proactive suggestions in one hour.
  maxSuggestionsPerHour: 3
  # Strength of stylistic personality. Valid value: 0.0 to 1.0.
  personalityStrength: 0.35
  # Verbosity preference for future tone expansion.
  verbosity: normal

notifications:
  # Whether assistant notifications are active.
  notificationsEnabled: true
  # Whether voice alerts can interrupt active speech/conversation.
  allowVoiceInterruptions: true
  # Whether critical alerts always interrupt.
  criticalNotificationsAlwaysInterrupt: true
  # Seconds before repeated non-critical notifications are suppressed.
  notificationCooldownSeconds: 30
  # Maximum queued notification items retained for delivery.
  maxQueuedNotifications: 50
  # Whether quiet hours are enabled.
  quietHoursEnabled: false
  # Runtime quiet-hours flag managed by future time/window logic.
  quietHoursActive: false

personalSchedule:
  # Whether the unified personal schedule hub is active.
  personalScheduleEnabled: true
  # Whether schedule-triggered notifications are enabled.
  scheduleNotificationsEnabled: true
  # Whether recurring schedule items are allowed.
  allowRecurringSchedules: true
  # Whether schedule data persists across restarts.
  persistScheduleData: true
  # Schedule tick cadence in seconds.
  scheduleTickIntervalSeconds: 1
  # Default reminder priority.
  defaultReminderPriority: NORMAL

weather:
  # Whether the weather module is active.
  weatherEnabled: true
  # Whether live weather API requests are allowed.
  weatherApiEnabled: true
  # Whether bridge-connected local sensors are preferred when available.
  localSensorWeatherEnabled: true
  # Whether weather alerts are enabled.
  weatherAlertsEnabled: true
  # Whether threshold-based weather notifications are enabled.
  weatherThresholdNotificationsEnabled: true
  # Whether API weather responses are cached.
  weatherForecastCacheEnabled: true
  # Refresh cadence in minutes.
  weatherRefreshIntervalMinutes: 15
  # Preferred external weather provider name.
  preferredWeatherProvider: openweathermap

spotify:
  # Whether the Spotify module is active.
  spotifyEnabled: true
  # Whether playback state monitoring is enabled.
  spotifyPlaybackMonitoringEnabled: true
  # Whether the Spotify overlay surface is enabled.
  spotifyOverlayEnabled: true
  # Whether Spotify cache persistence is enabled.
  spotifyCacheEnabled: true
  # Whether Aura should attempt reconnection after disconnects.
  spotifyReconnectEnabled: true
  # Playback polling cadence in seconds.
  spotifyPollingIntervalSeconds: 2
  # Default target device name.
  defaultDevice: Desktop
  # Cache file used for Spotify persistence.
  cachePath: spotify_cache.sqlite3

email:
  # Whether the unified email module is active.
  emailEnabled: true
  # Whether email inbox monitoring is enabled.
  emailMonitoringEnabled: true
  # Poll cadence for email sync and monitoring.
  emailSyncIntervalSeconds: 60
  # Whether email notifications are enabled.
  emailNotificationsEnabled: true
  # Default account id to prefer when one is available.
  emailDefaultAccount:
  # Whether email cache persistence is enabled.
  emailCacheEnabled: true
  # Whether sending an email requires confirmation.
  emailRequireConfirmationToSend: true
  # Whether deleting an email requires confirmation.
  emailRequireConfirmationToDelete: true
  # SQLite database used for email persistence and cache.
  databasePath: aura_email.sqlite3

safety:
  # Whether the execution governance layer is active.
  safetyLayerEnabled: true
  # Require confirmation for high-risk actions.
  requireConfirmationForHighRisk: true
  # Allow automation to bypass confirmation. This should remain false.
  allowAutomationWithoutConfirmation: false
  # Whether repeated executions are rate-limited.
  executionRateLimitEnabled: true
  # Maximum allowed executions per minute before throttling.
  maxExecutionsPerMinute: 20
  # Whether execution audit logs are written.
  auditLoggingEnabled: true
  # Confirmation timeout in seconds.
  confirmationTimeoutSeconds: 60
  # Whether critical automation is denied outright.
  denyCriticalAutomation: true
  # Manually granted permissions for trusted actions.
  grantedPermissions: []

execution:
  # Whether Aura routes actions through the unified execution pipeline.
  executionPipelineEnabled: true
  # Whether execution-time validation is enforced.
  executionValidationEnabled: true
  # Whether execution audit logging is enabled.
  executionAuditLoggingEnabled: true
  # Whether async execution support is enabled.
  allowAsyncExecution: true
  # Default execution timeout in seconds.
  executionTimeoutSeconds: 30

homeAutomationBridge:
  # HTTP timeout for bridge requests in seconds.
  timeout: 5
  # Bridge state refresh interval in seconds.
  refreshSeconds: 5
  # Aura protocol route on the bridge service.
  # Valid value: URL path beginning with /.
  protocolPath: /protocol/aura
  # Bridge inbox route.
  # Valid value: URL path beginning with /.
  inboxPath: /protocol/inbox
  # Bridge subscriptions route.
  # Valid value: URL path beginning with /.
  subscriptionsPath: /protocol/subscriptions
  # Bridge heartbeat route.
  # Valid value: URL path beginning with /.
  heartbeatPath: /protocol/heartbeat
  # Bridge session id to use.
  # Valid values: auto, or an explicit session id string.
  sessionId: auto
  # Interface label sent to the bridge.
  # Valid values commonly used: windows, web, android.
  interface: windows
  # Heartbeat interval in seconds.
  # Valid value: number > 0.
  heartbeatSeconds: 30
