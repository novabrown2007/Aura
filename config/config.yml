# Aura user configuration.
#
# This file is for values a normal user or deployer is expected to edit:
# API keys, database credentials, wake phrases, and local service addresses.
# Backend tuning and developer/runtime defaults live in config/devConfig.yml.

llm:
  # Ollama local model server settings.
  ollama:
    # URL for the Ollama generate API.
    # Valid value: an HTTP/HTTPS URL, or CHANGE_ME to read OLLAMA_ENDPOINT from .env.
    endpoint: CHANGE_ME

  # Gemini cloud model credentials.
  gemini:
    # Gemini API key.
    # Valid value: an API key string, or CHANGE_ME to read GEMINI_API_KEY from .env.
    api_secret: CHANGE_ME

# Hugging Face credentials used for local model downloads such as Faster-Whisper.
huggingFace:
  # Hugging Face access token.
  apiToken: CHANGE_ME

# Database login credentials
database:
  host: localhost
  port: 3306
  name: aura
  user: CHANGE_ME
  password: CHANGE_ME

voice:
  pushToTalk:
    # Whether held push-to-talk activation is enabled.
    # Valid values: true, false.
    enabled: true

  alwaysActive:
    # Whether passive local wake-word activation is enabled.
    # Valid values: true, false.
    enabled: true
    # User-facing wake words Aura should accept.
    activationPhrases: [ "Aura", "Hey Aura"]

# Connection credentials for the Home Automation Bridge
homeAutomationBridge:
  host: 127.0.0.1
  port: 8080
  ssl: false

# List of modules and their status
# Valid status values: enabled, disabled.
# Loadable module keys can use package names like home_automation or module names like homeAutomation.
# Note: llm and database are core runtime systems; they are listed for visibility but are initialized during runtime bootstrap.
modules:
  system: enabled
  database: enabled
  home_automation: enabled
  llm: enabled
  calendar: enabled
  reminders: enabled
  notifications: enabled
