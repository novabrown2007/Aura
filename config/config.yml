# Aura user configuration.
#
# This file is for values a normal user or deployer is expected to edit:
# API keys, database credentials, wake phrases, and local service addresses.
# Backend tuning and developer/runtime defaults live in config/devConfig.yml.

llm:
  # Ollama local model server settings.
  ollama:
    # URL for the Ollama generate API.
    # Valid value: an HTTP/HTTPS URL, or CHANGE_ME to read OLLAMA_ENDPOINT from .env.
    endpoint: CHANGE_ME

  # Gemini cloud model credentials.
  gemini:
    # Gemini API key.
    # Valid value: an API key string, or CHANGE_ME to read GEMINI_API_KEY from .env.
    api_secret: CHANGE_ME

# Hugging Face credentials used for local model downloads such as Faster-Whisper.
huggingFace:
  # Hugging Face access token.
  apiToken: CHANGE_ME

# Database login credentials
database:
  host: localhost
  port: 3306
  name: aura
  user: CHANGE_ME
  password: CHANGE_ME

voice:
  pushToTalk:
    # Whether held push-to-talk activation is enabled.
    # Valid values: true, false.
    enabled: true
    # Whether responses to push-to-talk and always-active prompts are spoken.
    # Valid values: true, false.
    pushToTalkAutoSpeak: true

  alwaysActive:
    # Whether passive local wake-word activation is enabled.
    # Valid values: true, false.
    enabled: true
    # User-facing wake words Aura should accept.
    # "Hey Jarvis" uses OpenWakeWord's built-in fallback model. "Hey Aura"
    # requires a custom trained model before it can be enabled reliably.
    activationPhrases: ["Hey Jarvis"]

interruptions:
  # Global interruption/cancellation layer for stop/cancel voice commands.
  interruptionsEnabled: true
  # Whether spoken commands like "Stop" and "Nevermind" trigger cancellation.
  interruptionVoiceCommandsEnabled: true
  # Whether interruptions clear pending clarification/conversation state.
  interruptionClearConversationState: true
  # Whether interruption requests and cancellation results are logged verbosely.
  interruptionDebugLogging: true

# Connection credentials for the Home Automation Bridge
homeAutomationBridge:
  host: 127.0.0.1
  port: 8080
  ssl: false

notifications:
  notificationsEnabled: true
  allowVoiceInterruptions: true
  criticalNotificationsAlwaysInterrupt: true
  notificationCooldownSeconds: 30
  maxQueuedNotifications: 50
  quietHoursEnabled: false
  quietHoursActive: false

personalSchedule:
  personalScheduleEnabled: true
  scheduleNotificationsEnabled: true
  allowRecurringSchedules: true
  persistScheduleData: true
  scheduleTickIntervalSeconds: 1
  defaultReminderPriority: NORMAL

weather:
  weatherEnabled: true
  weatherApiEnabled: true
  localSensorWeatherEnabled: true
  weatherAlertsEnabled: true
  weatherThresholdNotificationsEnabled: true
  weatherForecastCacheEnabled: true
  weatherRefreshIntervalMinutes: 15
  preferredWeatherProvider: openweathermap

spotify:
  spotifyEnabled: true
  spotifyPlaybackMonitoringEnabled: true
  spotifyOverlayEnabled: true
  spotifyCacheEnabled: true
  spotifyReconnectEnabled: true
  spotifyPollingIntervalSeconds: 2
  defaultDevice: Desktop
  cachePath: spotify_cache.sqlite3

email:
  emailEnabled: true
  emailMonitoringEnabled: true
  emailSyncIntervalSeconds: 60
  emailNotificationsEnabled: true
  emailDefaultAccount:
  emailCacheEnabled: true
  emailRequireConfirmationToSend: true
  emailRequireConfirmationToDelete: true
  databasePath: aura_email.sqlite3

safety:
  safetyLayerEnabled: true
  requireConfirmationForHighRisk: true
  allowAutomationWithoutConfirmation: false
  executionRateLimitEnabled: true
  maxExecutionsPerMinute: 20
  auditLoggingEnabled: true
  confirmationTimeoutSeconds: 60
  denyCriticalAutomation: true
  grantedPermissions: []

responses:
  structuredResponsesEnabled: true
  spokenResponseEnabled: true
  uiResponseEnabled: true
  responseMetadataEnabled: true
  responseFollowupsEnabled: true
  responseValidationEnabled: true

interface:
  desktop:
    windows:
      desktopOverlayEnabled: true
      assistantBubbleEnabled: true
      systemTrayEnabled: true
      minimizeToTrayOnClose: true
      overlayAlwaysOnTop: true
      overlayOpacity: 0.84
      overlayAnimationsEnabled: true
      overlayNotificationsEnabled: true
      overlayCompactMode: true
      overlayStartMinimized: true
      overlayBubbleDiameter: 56

# List of modules and their status
# Valid status values: enabled, disabled.
# Loadable module keys can use package names like home_automation or module names like homeAutomation.
# Note: llm and database are core runtime systems; they are listed for visibility but are initialized during runtime bootstrap.
modules:
  system: enabled
  database: enabled
  home_automation: enabled
  llm: enabled
  personalSchedule: enabled
  notifications: enabled
  weather: enabled
  spotify: enabled
  email: enabled
  smartHome: disabled
